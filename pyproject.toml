[project]
name = "cryptonlp"
version = "0.1.0"
description = "Autonomous AI research agents: crypto social-media NLP signals for Bitcoin and Ethereum risk (TCC)"
readme = "README.md"
authors = [{ name = "Berg"}]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "prefect>=3.9.1,<3.10",
    "pyarrow>=26",
    "httpx>=0.28",
    "websockets>=15,<17",
]

[project.scripts]
cryptonlp = "cryptonlp.cli:main"
cryptonlp-run-id = "cryptonlp.run_id:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# paper/ holds the article's own scripts; they are not part of the system.
extend-exclude = ["paper"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "db: needs the test database (docker compose up -d postgres-test)",
]
