name: cryptonlp

# Services are added as each build step needs them (see tech/build-plan.md).
# Step 0: Postgres + pgvector for real data, and a separate throwaway test database.
# Step 1: Grafana (default), and the collectors with Prefect (profile "collect").
# Step 3: normalization runs in the scheduler, with the pseudonymization key as a secret.
# Step 4: Label Studio (profile "collect"), with its own database on the main server.
# Step 5: MLflow (default), for the walk-forward runs; the classifier registry joins it in step 6.
# Step 6: SemIf's base model and the embedding model on vLLM (profile "gpu"), and the bake-off's
#   transformers scorer (profile "bakeoff", run on demand).
#   docker compose up -d --wait                    databases and Grafana
#   docker compose --profile collect up -d --build  also start collecting into the main database
#   docker compose --profile gpu up -d --wait       SemIf and the embeddings (needs the GPU)

# The app services share one image (Dockerfile) with only the locked dependencies; the repo is
# bind-mounted so run IDs carry the real git commit. They run as your user, so files in data/
# stay yours: set UID and GID in .env if yours are not 1000.
x-app: &app
  build: .
  image: cryptonlp-app
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - .:/app
  environment:
    CRYPTONLP_DATABASE_URL: postgresql://${POSTGRES_USER:-cryptonlp}:${POSTGRES_PASSWORD:-cryptonlp}@postgres:5432/cryptonlp
    CRYPTONLP_GRAFANA_DB_PASSWORD: ${CRYPTONLP_GRAFANA_DB_PASSWORD:-grafana}
    CRYPTONLP_RECORD_REPLAY: ${CRYPTONLP_RECORD_REPLAY:-false}
    CRYPTONLP_LABEL_STUDIO_DB_PASSWORD: ${CRYPTONLP_LABEL_STUDIO_DB_PASSWORD:-labelstudio}
    CRYPTONLP_MLFLOW_TRACKING_URI: http://mlflow:5000
    PREFECT_API_URL: http://prefect-server:4200/api
  profiles: ["collect"]

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cryptonlp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptonlp}
      POSTGRES_DB: cryptonlp
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cryptonlp"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The only database CI, tests and the simulated clock may touch.
  # Separate server, separate port, data on tmpfs: it can never share state with the real ledger.
  postgres-test:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: cryptonlp
      POSTGRES_PASSWORD: cryptonlp
      POSTGRES_DB: cryptonlp_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptonlp -d cryptonlp_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana-oss:13.0.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana-dashboards/system-health.json
      # Read by dashboards/provisioning (datasource password, alert contact point).
      GRAFANA_DB_PASSWORD: ${CRYPTONLP_GRAFANA_DB_PASSWORD:-grafana}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-unset}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-unset}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dashboards/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards/json:/var/lib/grafana-dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Applies db/init to the main database (idempotent) and sets Grafana's role password.
  db-init:
    <<: *app
    command: ["db", "init"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  prefect-server:
    image: prefecthq/prefect:3.9.1-python3.12
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_UI_API_URL: http://127.0.0.1:${PREFECT_PORT:-4200}/api
    ports:
      - "127.0.0.1:${PREFECT_PORT:-4200}:4200"
    volumes:
      - prefect-data:/root/.prefect
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\""]
      interval: 5s
      timeout: 5s
      retries: 30
    profiles: ["collect"]
    restart: unless-stopped

  # Runs the scheduled jobs: Mastodon, trends, Binance, deletion sync, raw-store check,
  # ledger check and anchor, normalization, and the forecast loop when CRYPTONLP_FORECAST_LOOP
  # is true (smoke runs, pilot, confirmatory period).
  scheduler:
    <<: *app
    command: ["serve"]
    environment:
      CRYPTONLP_DATABASE_URL: postgresql://${POSTGRES_USER:-cryptonlp}:${POSTGRES_PASSWORD:-cryptonlp}@postgres:5432/cryptonlp
      CRYPTONLP_GRAFANA_DB_PASSWORD: ${CRYPTONLP_GRAFANA_DB_PASSWORD:-grafana}
      CRYPTONLP_RECORD_REPLAY: ${CRYPTONLP_RECORD_REPLAY:-false}
      CRYPTONLP_FORECAST_LOOP: ${CRYPTONLP_FORECAST_LOOP:-false}
      # The hourly labeling sync runs only when the token is set.
      CRYPTONLP_LABEL_STUDIO_API_KEY: ${CRYPTONLP_LABEL_STUDIO_API_KEY:-}
      CRYPTONLP_LABEL_STUDIO_URL: http://label-studio:8080
      CRYPTONLP_MLFLOW_TRACKING_URI: http://mlflow:5000
      PREFECT_API_URL: http://prefect-server:4200/api
      CRYPTONLP_PSEUDONYM_KEY_FILE: /run/secrets/pseudonym_key
      # Step 6: the vLLM servers (profile "gpu"). The forecast loop labels with SemIf
      # (config/classify.toml); embeddings are scheduled only when CRYPTONLP_EMBEDDINGS is true.
      CRYPTONLP_SEMIF_URL: http://semif:8000
      CRYPTONLP_EMBED_URL: http://embed:8000
      CRYPTONLP_EMBEDDINGS: ${CRYPTONLP_EMBEDDINGS:-false}
    secrets:
      - pseudonym_key
    depends_on:
      db-init:
        condition: service_completed_successfully
      prefect-server:
        condition: service_healthy
    restart: unless-stopped

  # The Bluesky stream runs for days, so it is its own service, restarted if it dies.
  collector-bluesky:
    <<: *app
    command: ["collect", "bluesky"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  # Step 4: labeling. Local only. Its state lives in its own database (created by db-init); the
  # annotations are also copied hourly into labeling.annotations by the scheduler.
  label-studio:
    image: heartexlabs/label-studio:1.23.2
    environment:
      DJANGO_DB: default
      POSTGRE_HOST: postgres
      POSTGRE_PORT: "5432"
      POSTGRE_NAME: labelstudio
      POSTGRE_USER: labelstudio
      POSTGRE_PASSWORD: ${CRYPTONLP_LABEL_STUDIO_DB_PASSWORD:-labelstudio}
      # The account created on first start; log in with it at http://127.0.0.1:8080.
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME:-researcher@localhost}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD:-change-me-now}
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
    ports:
      - "127.0.0.1:${LABEL_STUDIO_PORT:-8080}:8080"
    volumes:
      - label-studio-data:/label-studio/data
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
    profiles: ["collect"]
    restart: unless-stopped

  # Step 5: experiment tracking. Walk-forward runs log here (`cryptonlp arm1 walkforward`);
  # open http://127.0.0.1:5000. Runs and artifacts live in the volume (SQLite: the official
  # image has no Postgres driver). Development results only: what the study rests on is in the
  # ledger.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination=/mlflow/artifacts
      - --allowed-hosts=mlflow:5000,localhost:*,127.0.0.1:*
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Step 6: SemIf's base model, served for its option logits (src/cryptonlp/classify/vllm.py).
  # Pinned to SemIf's own revision and served under "<model>@<revision>", the name
  # config/classify.toml asks for, so a server on another revision is refused. Raw logits, not
  # log-probabilities, are returned for the requested tokens (SemIf's readout). Weights are
  # cached in ~/.cache/huggingface. On the 16 GB card it shares the GPU with `embed`; stop both
  # before the bake-off's `hf-scorer` runs OpenJev (another 4B model).
  semif:
    image: vllm/vllm-openai:v0.33.0
    command:
      - Qwen/Qwen3.5-4B
      - --revision=851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
      - --tokenizer-revision=851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
      - --served-model-name=Qwen/Qwen3.5-4B@851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
      - --dtype=bfloat16
      - --max-model-len=8192
      - --gpu-memory-utilization=${SEMIF_GPU_MEMORY:-0.74}
      # Prompts are short (a post plus a rubric item): a smaller batch envelope leaves the
      # memory to the KV cache. 8.0 GiB of weights, measured 4 Nov 2026.
      - --max-num-seqs=64
      - --max-num-batched-tokens=8192
      - --logprobs-mode=raw_logits
      - --max-logprobs=16
      - --enable-prefix-caching
      - --limit-mm-per-prompt={"image":0,"video":0}
      - --generation-config=vllm
      - --seed=0
    environment:
      HF_HOME: /hf
    volumes:
      - ${HOME}/.cache/huggingface:/hf
    ipc: host
    # Docker on this machine shares one memory cap across containers: if it is reached, the
    # kernel should kill this server, never Postgres or a collector.
    oom_score_adj: 800
    ports:
      - "127.0.0.1:${SEMIF_PORT:-8001}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 600s  # first start compiles CUDA graphs for a few minutes
    profiles: ["gpu"]
    restart: unless-stopped

  # Step 6: embeddings for the Analyst's semantic search (clean.embeddings, pgvector).
  embed:
    image: vllm/vllm-openai:v0.33.0
    command:
      - Qwen/Qwen3-Embedding-0.6B
      - --revision=97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
      - --tokenizer-revision=97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
      - --served-model-name=Qwen/Qwen3-Embedding-0.6B@97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
      - --runner=pooling
      # Posts are short; longer ones are cut to this many tokens (classify/embed.py).
      - --max-model-len=2048
      - --max-num-batched-tokens=2048
      - --max-num-seqs=64
      - --enforce-eager
      - --gpu-memory-utilization=${EMBED_GPU_MEMORY:-0.20}
      - --seed=0
    environment:
      HF_HOME: /hf
    volumes:
      - ${HOME}/.cache/huggingface:/hf
    ipc: host
    # Docker on this machine shares one memory cap across containers: if it is reached, the
    # kernel should kill this server, never Postgres or a collector.
    oom_score_adj: 800
    ports:
      - "127.0.0.1:${EMBED_PORT:-8002}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      semif:
        condition: service_healthy  # vLLM sizes its memory from what is free: start second
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 90s
    profiles: ["gpu"]
    restart: unless-stopped

  # Step 6 bake-off: CryptoBERT, FinBERT and Wortega's OpenJev with transformers, from the
  # vLLM image (its PyTorch supports the Blackwell card). Run on demand, one model at a time,
  # with `semif` and `embed` stopped (GPU memory, and Docker's shared RAM cap: 4 Nov 2026 the
  # three together pushed Postgres into crash recovery):
  #   docker compose run --rm hf-scorer <model> <run directory under data/bakeoff>
  # It reads only the bake-off inputs and writes only the raw scores (scripts/hf_score.py).
  hf-scorer:
    image: vllm/vllm-openai:v0.33.0
    entrypoint: ["python3", "/app/scripts/hf_score.py"]
    environment:
      HF_HOME: /hf
      OWNER_UID: ${UID:-1000}
      OWNER_GID: ${GID:-1000}
    volumes:
      - ${HOME}/.cache/huggingface:/hf
      - ./scripts:/app/scripts:ro
      - ./config:/app/config:ro
      - ./data/bakeoff:/app/data/bakeoff
    ipc: host
    oom_score_adj: 800
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["bakeoff"]
    restart: "no"

# The key never enters the repository. Create it once with `uv run cryptonlp keygen`.
secrets:
  pseudonym_key:
    file: ${CRYPTONLP_PSEUDONYM_KEY_HOST_FILE:-${HOME}/.config/cryptonlp/pseudonym.key}

volumes:
  pgdata:
  grafana-data:
  prefect-data:
  label-studio-data:
  mlflow-data:
